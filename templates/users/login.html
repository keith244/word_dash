{% extends 'layout/base.html' %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gray-950">
  <div class="bg-gray-900 p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">Welcome Back</h2>

    {% if messages %}
      {% for message in messages %}
        <div class="mb-4 text-sm text-red-400 bg-red-900/30 px-4 py-2 rounded-lg">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm text-gray-400 mb-1">Username or Email</label>
        <input type="text" name="username_or_email"
          class="w-full bg-gray-800 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm text-gray-400 mb-1">Password</label>
        <input type="password" name="password"
          class="w-full bg-gray-800 text-white rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2 rounded-lg transition">
        Log In
      </button>
    </form>
    <p class="text-center text-gray-500 text-sm mt-4">
      No account? <a href="{% url 'register' %}" class="text-indigo-400 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
