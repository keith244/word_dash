<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Dash</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-950 text-white">

  {% if user.is_authenticated %}
  <!-- Global notification bell -->
  <div id="notif-bell" style="position:fixed; top:12px; right:16px; z-index:999; cursor:pointer;" onclick="toggleNotifications()">
    <div style="position:relative;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#aebac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span id="notif-count" style="display:none; position:absolute; top:-6px; right:-6px; background:#00a884; color:#fff; font-size:10px; font-weight:500; border-radius:50%; width:16px; height:16px; align-items:center; justify-content:center;"></span>
    </div>
  </div>

  <!-- Notifications dropdown -->
  <div id="notif-dropdown" style="display:none; position:fixed; top:44px; right:16px; z-index:999; background:#202c33; border:0.5px solid #2a3942; border-radius:12px; width:300px; max-height:400px; overflow-y:auto;">
    <div style="padding:12px 16px; border-bottom:0.5px solid #2a3942; font-size:13px; font-weight:500; color:#e9edef;">Notifications</div>
    <div id="notif-list" style="padding:8px 0;"></div>
  </div>

  <script>
    let notifOpen = false;

    function toggleNotifications() {
      notifOpen = !notifOpen;
      const dropdown = document.getElementById('notif-dropdown');
      dropdown.style.display = notifOpen ? 'block' : 'none';
      if (notifOpen) loadNotifications();
    }

    function loadNotifications() {
      fetch('/word_dash/notifications/')
        .then(r => r.json())
        .then(data => {
          const list = document.getElementById('notif-list');
          if (data.notifications.length === 0) {
            list.innerHTML = `<div style="padding:12px 16px; color:#8696a0; font-size:13px;">No notifications yet.</div>`;
            return;
          }
          list.innerHTML = data.notifications.map(n => `
            <div style="padding:10px 16px; border-bottom:0.5px solid #1f2c33;">
              <div style="font-size:13px; color:#e9edef;">${n.message}</div>
              ${n.type === 'challenge_received' ? `
                <div style="display:flex; gap:8px; margin-top:8px;">
                  <a href="/word_dash/challenge/${n.challenge_id}/accept/"
                    style="flex:1; background:#00a884; border:none; border-radius:6px; padding:6px; color:#fff; font-size:12px; font-weight:500; text-align:center; text-decoration:none;">Accept</a>
                  <a href="/word_dash/challenge/${n.challenge_id}/decline/"
                    style="flex:1; background:#2a3942; border:none; border-radius:6px; padding:6px; color:#aebac1; font-size:12px; text-align:center; text-decoration:none;">Decline</a>
                </div>` : ''}
            </div>
          `).join('');
          document.getElementById('notif-count').style.display = 'none';
        });
    }

    // Poll for unread count every 15 seconds
    function checkUnread() {
      fetch('/word_dash/notifications/')
        .then(r => r.json())
        .then(data => {
          const unread = data.notifications.filter(n => !n.is_read).length;
          const badge = document.getElementById('notif-count');
          if (unread > 0) {
            badge.textContent = unread;
            badge.style.display = 'flex';
          } else {
            badge.style.display = 'none';
          }
        });
    }

    checkUnread();
    setInterval(checkUnread, 15000);

    document.addEventListener('click', function(e) {
      if (!document.getElementById('notif-bell').contains(e.target)) {
        document.getElementById('notif-dropdown').style.display = 'none';
        notifOpen = false;
      }
    });
  </script>
  {% endif %}

  {% block content %}{% endblock %}
</body>
</html>
