{% extends 'layout/base.html' %}

{% block content %}

<div style="height:100vh; display:flex; align-items:center; justify-content:center; background:#111b21;">

<div style="display:flex; height:90vh; width:95vw; max-width:1200px; border-radius:12px; overflow:hidden; border:0.5px solid #2a3942; font-family:sans-serif; background:#111b21;">

  <!-- LEFT PANEL -->
  <div style="width:340px; min-width:340px; border-right:0.5px solid #2a3942; display:flex; flex-direction:column; background:#111b21;">

    <!-- Header -->
    <div style="padding:10px 16px; display:flex; align-items:center; justify-content:space-between; background:#202c33;">
      <div style="width:38px; height:38px; border-radius:50%; background:#00a884; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:500; color:#fff;">
        {{ request.user.username|first|upper }}
      </div>
      <div style="display:flex; gap:20px; align-items:center;">
        <a href="#" style="opacity:0.7;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aebac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="10" width="5" height="11"/><rect x="9" y="6" width="5" height="15"/><rect x="16" y="2" width="5" height="19"/></svg>
        </a>
        <a href="#" style="opacity:0.7;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aebac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        </a>
        <a href="{% url 'logout' %}" style="opacity:0.7;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aebac1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </a>
      </div>
    </div>

    <!-- Search -->
    <div style="padding:8px 12px; background:#111b21;">
      <input id="search" type="text" placeholder="Search players by username..."
        style="width:100%; background:#202c33; border:none; border-radius:8px; padding:8px 12px; color:#d1d7db; font-size:13px; outline:none; box-sizing:border-box;">
    </div>

    <!-- Players list -->
    <div id="players-list" style="flex:1; overflow-y:auto;">
      <div style="padding:24px 16px; text-align:center; color:#8696a0; font-size:13px;">
        Search for a player to challenge them.
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div style="flex:1; display:flex; flex-direction:column; background:#0b141a; align-items:center; justify-content:center;">
    <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#2a3942" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    <p style="color:#2a3942; font-size:14px; margin-top:16px;">Search for a player to start a match</p>
  </div>

</div>
</div>

<!-- Challenge received popup -->
<div id="challenge-popup" style="display:none; position:fixed; top:20px; right:20px; background:#202c33; border:0.5px solid #2a3942; border-radius:12px; padding:16px 20px; width:280px; z-index:1000;">
  <div style="font-size:14px; font-weight:500; color:#e9edef; margin-bottom:4px;" id="popup-title">Challenge received!</div>
  <div style="font-size:13px; color:#8696a0; margin-bottom:14px;" id="popup-body"></div>
  <div style="display:flex; gap:8px;">
    <button id="accept-btn" onclick="respondChallenge('accept')"
      style="flex:1; background:#00a884; border:none; border-radius:8px; padding:8px; color:#fff; font-size:13px; font-weight:500; cursor:pointer;">
      Accept
    </button>
    <button onclick="respondChallenge('decline')"
      style="flex:1; background:#2a3942; border:none; border-radius:8px; padding:8px; color:#aebac1; font-size:13px; cursor:pointer;">
      Decline
    </button>
  </div>
</div>

<!-- Challenge sent toast -->
<div id="toast" style="display:none; position:fixed; bottom:24px; right:20px; background:#202c33; border:0.5px solid #2a3942; border-radius:8px; padding:10px 16px; font-size:13px; color:#e9edef; z-index:1000;"></div>

<script>
  console.log('Script loaded');

  const socket = new WebSocket(`ws://${window.location.host}/ws/lobby/`);
  const playersList = document.getElementById('players-list');
  const searchInput = document.getElementById('search');
  let pendingChallengeId = null;

  socket.onopen = function() { console.log('WebSocket connected!'); };
  socket.onerror = function(e) { console.log('WebSocket error:', e); };
  socket.onclose = function(e) { console.log('WebSocket closed:', e.code, e.reason); };

  // Search
  let searchTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const q = searchInput.value.trim();
      if (q.length < 1) {
        playersList.innerHTML = `<div style="padding:24px 16px; text-align:center; color:#8696a0; font-size:13px;">Search for a player to challenge them.</div>`;
        return;
      }
      fetch(`/word_dash/search/?q=${encodeURIComponent(q)}`)
        .then(r => r.json())
        .then(data => renderPlayers(data.users));
    }, 300);
  });

  function renderPlayers(users) {
    if (users.length === 0) {
      playersList.innerHTML = `<div style="padding:24px 16px; text-align:center; color:#8696a0; font-size:13px;">No players found.</div>`;
      return;
    }
    playersList.innerHTML = users.map(u => `
      <div onclick="sendChallenge(${u.id}, '${u.username}')"
        style="display:flex; align-items:center; gap:12px; padding:10px 16px; cursor:pointer; border-bottom:0.5px solid #1f2c33; transition:background 0.15s;"
        onmouseover="this.style.background='#202c33'" onmouseout="this.style.background='transparent'">
        <div style="position:relative;">
          <div style="width:38px; height:38px; border-radius:50%; background:#7c3aed; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; color:#fff;">
            ${u.username[0].toUpperCase()}
          </div>
          <div id="dot-${u.id}" style="width:9px; height:9px; border-radius:50%; background:#8696a0; border:2px solid #111b21; position:absolute; bottom:0; right:0;"></div>
        </div>
        <div style="flex:1;">
          <div style="font-size:14px; font-weight:500; color:#e9edef;">${u.username}</div>
          <div style="font-size:12px; color:#8696a0; margin-top:2px;">Click to challenge</div>
        </div>
      </div>
    `).join('');
  }

  function sendChallenge(opponentId, opponentUsername) {
    console.log('Sending challenge to:', opponentUsername, 'id:', opponentId);
    socket.send(JSON.stringify({
      action: 'send_challenge',
      opponent_id: opponentId,
    }));
    showToast(`Challenge sent to ${opponentUsername}...`);
  }

  function respondChallenge(response) {
    console.log('Responding:', response, 'challenge_id:', pendingChallengeId);
    if (response === 'accept') {
      socket.send(JSON.stringify({
        action: 'accept_challenge',
        challenge_id: pendingChallengeId,
      }));
    } else {
      socket.send(JSON.stringify({
        action: 'decline_challenge',
        challenge_id: pendingChallengeId,
      }));
    }
    document.getElementById('challenge-popup').style.display = 'none';
    pendingChallengeId = null;
  }

  function showToast(msg, duration=3000) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.style.display = 'block';
    setTimeout(() => toast.style.display = 'none', duration);
  }

  socket.onmessage = function(e) {
    const data = JSON.parse(e.data);
    console.log('WS message received:', data);

    if (data.type === 'challenge_received') {
      pendingChallengeId = data.challenge_id;
      document.getElementById('popup-body').textContent = `${data.challenger} wants to play. Accept?`;
      document.getElementById('challenge-popup').style.display = 'block';
    }

    else if (data.type === 'challenge_accepted') {
      console.log('Redirecting to match:', data.match_id);
      window.location.href = `/word_dash/match/${data.match_id}/`;
    }

    else if (data.type === 'challenge_declined') {
      showToast(`${data.opponent} declined your challenge.`);
    }

    else if (data.type === 'challenge_sent') {
      showToast(`Challenge sent! Waiting for response...`);
    }

    else if (data.type === 'user_online') {
      const dot = document.getElementById(`dot-${data.user_id}`);
      if (dot) dot.style.background = '#00a884';
    }

    else if (data.type === 'user_offline') {
      const dot = document.getElementById(`dot-${data.user_id}`);
      if (dot) dot.style.background = '#8696a0';
    }
  };
</script>
{% endblock %}
